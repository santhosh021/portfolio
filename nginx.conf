# Anyone visiting portfolio.imsanthosh.tech or www.imsanthosh.tech, is sent to the main address.
server {
  listen 80;
  server_name portfolio.imsanthosh.tech www.imsanthosh.tech;
  return 301 https://imsanthosh.tech$request_uri;
}

server {
  listen 80 default_server;
  server_name imsanthosh.tech;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}